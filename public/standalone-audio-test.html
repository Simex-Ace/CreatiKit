<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独立音频测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .log-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            text-align: left;
            margin-top: 20px;
        }
        #status {
            color: #0066cc;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>独立音频测试页面</h1>
    <p>这个页面完全独立，只包含最基本的音频播放功能</p>
    <div id="status">请点击下方按钮播放测试音</div>
    
    <script src="test-audio.js"></script>
    
    <div class="log-container">
        <h3>调试日志将显示在这里</h3>
        <pre id="log-output"></pre>
    </div>
    
    <script>
        // 重定向console.log到页面
        const originalConsoleLog = console.log;
        const logOutput = document.getElementById('log-output');
        
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            const logEntry = document.createElement('div');
            logEntry.textContent = new Date().toLocaleTimeString() + ': ' + args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
            ).join(' ');
            logOutput.appendChild(logEntry);
            logOutput.scrollTop = logOutput.scrollHeight;
        };
        
        // 也重定向console.error
        const originalConsoleError = console.error;
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            const logEntry = document.createElement('div');
            logEntry.style.color = 'red';
            logEntry.textContent = new Date().toLocaleTimeString() + ' [ERROR]: ' + args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
            ).join(' ');
            logOutput.appendChild(logEntry);
            logOutput.scrollTop = logOutput.scrollHeight;
        };
        
        // 页面加载时的信息
        console.log('独立音频测试页面已加载');
        console.log('浏览器信息:', navigator.userAgent);
        console.log('音频API支持:', 'AudioContext' in window || 'webkitAudioContext' in window);
    </script>
</body>
</html>
