<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 背景圆形 - 更圆润、更柔和 -->
  <rect width="256" height="256" rx="80" fill="url(#gradientBg)"/>
  
  <!-- 可爱的工具箱主体 - 圆润的形状 -->
  <rect x="56" y="88" width="144" height="100" rx="16" fill="#FFFFFF" stroke="#FFD1DC" stroke-width="4"/>
  
  <!-- 工具箱的把手 - 圆润的弧线 -->
  <ellipse cx="128" cy="72" rx="40" ry="16" fill="#FFFFFF" stroke="#FFD1DC" stroke-width="4"/>
  
  <!-- 可爱的工具元素 -->
  <!-- 调色板 - 彩色圆点 -->
  <circle cx="88" cy="128" r="12" fill="#FF6B6B"/>
  <circle cx="120" cy="128" r="12" fill="#4ECDC4"/>
  <circle cx="152" cy="128" r="12" fill="#FFD166"/>
  <circle cx="184" cy="128" r="12" fill="#845EC2"/>
  
  <!-- 可爱的代码块 - 圆角矩形 -->
  <rect x="80" y="160" width="32" height="20" rx="6" fill="#C34A36"/>
  <rect x="120" y="160" width="24" height="8" rx="3" fill="#C34A36"/>
  <rect x="120" y="172" width="32" height="8" rx="3" fill="#C34A36"/>
  
  <!-- 可爱的小方块/网格 - 代表二维码或其他工具 -->
  <g transform="translate(160, 160)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="#0089BA"/>
    <rect x="8" y="8" width="8" height="8" rx="2" fill="white"/>
    <rect x="16" y="8" width="8" height="8" rx="2" fill="white"/>
    <rect x="8" y="16" width="8" height="8" rx="2" fill="white"/>
    <rect x="16" y="16" width="8" height="8" rx="2" fill="white"/>
  </g>
  
  <!-- 眼睛 - 让图标更萌 -->
  <circle cx="104" cy="104" r="6" fill="#2D3748"/>
  <circle cx="152" cy="104" r="6" fill="#2D3748"/>
  <circle cx="108" cy="100" r="2" fill="white"/>
  <circle cx="156" cy="100" r="2" fill="white"/>
  
  <!-- 小嘴巴 - 微笑 -->
  <path d="M128 116 Q134 124, 140 116" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 腮红效果 - 更可爱 -->
  <circle cx="92" cy="116" r="10" fill="#FFA5A5" opacity="0.6"/>
  <circle cx="164" cy="116" r="10" fill="#FFA5A5" opacity="0.6"/>
  
  <!-- 渐变背景 - 更柔和的色彩 -->
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD6FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E0C3FC;stop-opacity:1"/>
    </linearGradient>
  </defs>
</svg>