<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单音频测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .notes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .note-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2196F3;
        }
    </style>
</head>
<body>
    <h1>简单音频测试</h1>
    <p>点击按钮播放声音</p>
    
    <button id="testBtn">测试音调 (A4 - 440Hz)</button>
    
    <div class="notes">
        <button class="note-btn" data-note="C4">C4</button>
        <button class="note-btn" data-note="D4">D4</button>
        <button class="note-btn" data-note="E4">E4</button>
        <button class="note-btn" data-note="F4">F4</button>
        <button class="note-btn" data-note="G4">G4</button>
        <button class="note-btn" data-note="A4">A4</button>
        <button class="note-btn" data-note="B4">B4</button>
        <button class="note-btn" data-note="C5">C5</button>
        <button class="note-btn" data-note="C#4">C#4</button>
        <button class="note-btn" data-note="D#4">D#4</button>
    </div>
    
    <button id="stopBtn">停止所有声音</button>
    
    <div id="status"></div>

    <script>
        // 音符频率表
        const NOTE_FREQUENCIES = {
            'C4': 261.63,
            'C#4': 277.18,
            'D4': 293.66,
            'D#4': 311.13,
            'E4': 329.63,
            'F4': 349.23,
            'F#4': 369.99,
            'G4': 392.00,
            'G#4': 415.30,
            'A4': 440.00,
            'A#4': 466.16,
            'B4': 493.88,
            'C5': 523.25
        };
        
        let audioContext = null;
        let activeOscillators = [];
        
        // 更新状态显示
        function updateStatus(message) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            console.log(message);
        }
        
        // 初始化音频上下文
        function initAudioContext() {
            try {
                if (!audioContext) {
                    updateStatus('创建音频上下文...');
                    // 不使用类型断言，直接使用
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    updateStatus('音频上下文已创建，状态: ' + audioContext.state);
                }
                
                if (audioContext.state === 'suspended') {
                    updateStatus('恢复音频上下文...');
                    audioContext.resume();
                    updateStatus('音频上下文已恢复，状态: ' + audioContext.state);
                }
                
                return true;
            } catch (error) {
                updateStatus('初始化音频上下文失败: ' + error.message);
                return false;
            }
        }
        
        // 播放音符
        function playNote(frequency) {
            try {
                updateStatus('播放音符，频率: ' + frequency + 'Hz');
                
                // 初始化音频上下文
                if (!initAudioContext()) {
                    return false;
                }
                
                // 停止当前所有声音
                stopAllSounds();
                
                // 创建音频节点
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                // 设置为方波，最大音量
                oscillator.type = 'square';
                oscillator.frequency.value = frequency;
                gainNode.gain.value = 1.0;
                
                // 连接
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // 播放
                oscillator.start();
                
                // 存储振荡器引用
                activeOscillators.push({
                    oscillator: oscillator,
                    gain: gainNode
                });
                
                updateStatus('音符已播放');
                return true;
            } catch (error) {
                updateStatus('播放音符失败: ' + error.message);
                return false;
            }
        }
        
        // 停止所有声音
        function stopAllSounds() {
            updateStatus('停止所有声音');
            
            // 停止并清理所有振荡器
            activeOscillators.forEach(item => {
                try {
                    item.oscillator.stop();
                } catch (e) {
                    // 忽略已停止的振荡器错误
                }
            });
            
            activeOscillators = [];
        }
        
        // 测试按钮点击事件
        document.getElementById('testBtn').addEventListener('click', () => {
            updateStatus('点击了测试按钮');
            playNote(440); // A4
        });
        
        // 音符按钮点击事件
        document.querySelectorAll('.note-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const note = btn.getAttribute('data-note');
                const frequency = NOTE_FREQUENCIES[note];
                if (frequency) {
                    updateStatus('点击了 ' + note + ' 按钮');
                    playNote(frequency);
                }
            });
        });
        
        // 停止按钮点击事件
        document.getElementById('stopBtn').addEventListener('click', stopAllSounds);
        
        // 页面加载时的提示
        updateStatus('页面加载完成，请点击按钮播放声音');
        console.log('简单音频测试页面已加载');
    </script>
</body>
</html>
